# 自助下单网站 —— Nginx 反向代理配置
#
# 什么时候需要这个文件：
#   · 想用 80/443 端口访问，地址栏里不带 :3000
#   · 想上 HTTPS
#   · 想加域名
# 只用 IP:3000 访问的话，不需要 Nginx，跳到 DEPLOY.md 第 6 步即可。
#
# 安装：
#   cp deploy/nginx-shop.conf /etc/nginx/conf.d/shop.conf
#   # 把里面的 your-domain.com 改成你的域名
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # 上传收款码/商品图最大 5MB，这里留一点余量
    client_max_body_size 8m;

    # 访问日志
    access_log /var/log/nginx/shop.access.log;
    error_log  /var/log/nginx/shop.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 这三行必须加，否则服务端拿到的是 Nginx 的 IP，
        # 限流会把所有买家当成同一个人
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # 上传的图片让 Nginx 直接发，不走 Node
    location /uploads/ {
        alias /www/shop/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 隐藏文件不对外
    location ~ /\. {
        deny all;
    }
}

# ---------------------------------------------------------------------
# 配上 HTTPS 之后，把上面整段换成下面这样（证书用 certbot 自动申请）：
#
#   dnf install -y certbot python3-certbot-nginx
#   certbot --nginx -d your-domain.com
#
# certbot 会自动改写这个文件并配好自动续期，不用手动维护。
# ---------------------------------------------------------------------
