<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单查询</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header" data-site-header></header>
<div class="notice-bar" data-site-notice hidden></div>

<main class="page">
  <div class="wrap" style="max-width:760px">

    <div class="panel">
      <div class="panel-head"><h3>查询我的订单</h3></div>
      <div class="panel-body stack">
        <div class="field">
          <label class="required" for="orderNo">订单号</label>
          <input class="input" id="orderNo" type="text" maxlength="30" autocomplete="off"
                 placeholder="例如 20261015A1B2C3D4" style="font-family:ui-monospace,Consolas,monospace">
        </div>
        <div class="field" id="contactField">
          <label class="required" for="contact">下单时的联系方式</label>
          <input class="input" id="contact" type="text" maxlength="80"
                 placeholder="邮箱 / QQ / 手机号">
        </div>
        <button class="btn btn-primary btn-lg btn-block" id="queryBtn" type="button">立即查询</button>
        <div class="hint" style="text-align:center">
          订单号在下单成功后的页面上，也保存在你付款时使用的设备里
        </div>
      </div>
    </div>

    <div id="result"></div>

  </div>
</main>

<footer class="site-footer" data-site-footer></footer>

<script src="/js/common.js"></script>
<script src="/js/query.js"></script>
</body>
</html>
