<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自助下单</title>
<meta name="description" content="自助下单，自动发货，7×24 小时在线营业。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text y='72' x='50' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>店</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header" data-site-header></header>
<div class="notice-bar" data-site-notice hidden></div>

<main class="page">
  <div class="wrap">

    <section class="hero" id="hero" hidden>
      <h1 id="heroTitle"></h1>
      <p id="heroSubtitle"></p>
      <div class="badges">
        <span>⚡ 付款后自动发货</span>
        <span>🔒 官方授权正品</span>
        <span>💬 客服在线答疑</span>
        <span>🕐 全年无休</span>
      </div>
    </section>

    <div class="toolbar">
      <div class="chips" id="chips">
        <button class="chip active" data-cat="all">全部</button>
      </div>
      <select class="select" id="sort" aria-label="排序方式">
        <option value="default">综合排序</option>
        <option value="sales">销量优先</option>
        <option value="price_asc">价格从低到高</option>
        <option value="price_desc">价格从高到低</option>
      </select>
    </div>

    <div class="grid" id="grid"></div>
    <div id="emptyState" hidden>
      <div class="empty">
        <div class="icon">🔍</div>
        <h3>没有找到相关商品</h3>
        <p>换个关键词或分类试试，也可以直接联系客服</p>
      </div>
    </div>

  </div>
</main>

<footer class="site-footer" data-site-footer></footer>

<script src="/js/common.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
